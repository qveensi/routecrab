version: 2
updates:
  # Rust dependencies (Cargo.toml / Cargo.lock)
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Batch low-risk patch/minor bumps into one PR to cut noise.
      patch-minor:
        update-types:
          - minor
          - patch
    ignore:
      # kube 4 requires k8s-openapi 0.28, but gateway-api (0.21.0, latest) still
      # pins kube 3.1.0 / k8s-openapi 0.27. Bumping either one alone puts two
      # incompatible trees in the lockfile: the transitive k8s-openapi has no
      # v1_* feature enabled, so its build script aborts, and HTTPRoute would
      # still carry a kube-core 3.x Resource impl that kube 4 does not accept.
      # The three move together or not at all — drop these entries once
      # kube-rs/gateway-api-rs ships a kube-4 release (upstream PRs #238, #237).
      - dependency-name: "kube"
        update-types: ["version-update:semver-major"]
      # k8s-openapi is pre-1.0, so 0.27 -> 0.28 is the breaking step Dependabot
      # classifies as minor. Patches still come through.
      - dependency-name: "k8s-openapi"
        update-types: ["version-update:semver-minor"]

  # GitHub Actions (pinned by SHA; Dependabot bumps the SHA + version comment)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      # init/autobuild/analyze/upload-sarif are separate Dependabot
      # dependencies but one product: CodeQL aborts when the version that
      # wrote the config differs from the one running ("Loaded a
      # configuration file for version X, but running version Y"). Ungrouped,
      # Dependabot bumps them one at a time and every such PR fails.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Dockerfile base images (pinned by digest; Dependabot bumps the digest)
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
