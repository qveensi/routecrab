name: scorecard
on:
  # Re-score when branch protection changes, weekly, and on pushes to main.
  branch_protection_rule:
  schedule:
    - cron: "30 7 * * 1"
  push:
    branches: [main]
permissions: read-all
jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload findings to the code-scanning dashboard.
      security-events: write
      # Publish results to the public OpenSSF API (enables the README badge).
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Read-only fine-grained PAT (Administration/Contents/Metadata: read)
          # so the Branch-Protection check can read protection rules. Shared
          # read-only token for any read-only workflow; falls back to the
          # default token (Branch-Protection stays errored) if unset.
          repo_token: ${{ secrets.REPO_READ_TOKEN || github.token }}
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
